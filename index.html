<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B2545">
<title>Gastos</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#EEF2F8;color:#0B2545;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
header{background:linear-gradient(135deg,#0B2545,#1D4E89);color:#fff;padding:32px 20px 60px}
header div{max-width:430px;margin:0 auto}
header h1{margin:0;font-size:24px;letter-spacing:.2px}
header p{margin:6px 0 0;font-size:14px;color:#C9D8EE}
main{max-width:430px;margin:-36px auto 0;padding:0 20px 28px;display:flex;flex-direction:column;gap:16px}
.f{display:flex;flex-direction:column;gap:16px;background:#fff;border-radius:20px;padding:20px;border-top:4px solid #C9A227;box-shadow:0 10px 30px rgba(11,37,69,.14)}
.f p{margin:0;font-size:14px;color:#3A5273}
[hidden]{display:none!important}
label{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#1D4E89;display:block;margin-bottom:6px}
input,select{width:100%;height:52px;padding:0 16px;border:1px solid #CBD6E6;border-radius:12px;background:#F8FAFD;font-size:16px;color:#0B2545}
input:focus,select:focus{outline:none;border-color:#1D4E89;box-shadow:0 0 0 3px rgba(29,78,137,.18);background:#fff}
#m{height:60px;font-size:28px;font-weight:700}
button{height:56px;border:0;border-radius:14px;background:linear-gradient(135deg,#0B2545,#1D4E89);color:#fff;font-size:17px;font-weight:700}
button:disabled{opacity:.5}
#st,#pend{min-height:20px;font-size:14px;color:#3A5273;text-align:center}
</style>
</head>
<body>
<header><div><h1>Control de gastos</h1><p>Registro rápido</p></div></header>
<main>
<div id="cfg" class="f" hidden>
<p>Primera vez: pega los datos de configuración (solo una vez en este dispositivo).</p>
<div><label for="u">Dirección del script (termina en /exec)</label><input id="u" autocomplete="off"></div>
<div><label for="k0">Clave</label><input id="k0" autocomplete="off"></div>
<button id="sc">Guardar configuración</button>
</div>
<div id="form" class="f" hidden>
<div><label for="f">Fecha</label><input id="f" type="date"></div>
<div><label for="c">Concepto</label><input id="c" autocomplete="off" placeholder="Ej. Tacos"></div>
<div><label for="m">Monto</label><input id="m" inputmode="decimal" placeholder="0.00"></div>
<div><label for="k">Categoría</label><select id="k"><option>Esencial</option><option>Mantener</option><option>Innecesario</option></select></div>
<button id="go">Guardar</button>
</div>
<div id="st"></div>
<div id="pend"></div>
<a href="#" id="rc" hidden style="font-size:13px;color:#1D4E89;align-self:center">Cambiar configuración</a>
</main>
<script>
const $ = id => document.getElementById(id), L = localStorage;
const say = t => { $('st').textContent = t; $('st').style.color = /^(Error|Falta|Revisa)/.test(t) ? '#B3261E' : /^Guardado/.test(t) ? '#1B7F5C' : '#3A5273'; };
const q = () => JSON.parse(L.q || '[]');

async function send(g) {
  const r = await fetch(L.u, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ k: L.k, ...g }) });
  const j = await r.json();
  if (!j.ok) throw Object.assign(new Error(j.error), { fatal: true });
  return j.row;
}

// Reintenta los gastos que quedaron pendientes por falta de conexión
async function flush() {
  let c = q();
  while (c.length) {
    try { await send(c[0]); } catch (e) { if (!e.fatal) break; }
    c.shift(); L.q = JSON.stringify(c);
  }
  $('pend').textContent = c.length ? c.length + ' gasto(s) pendiente(s) por enviar' : '';
}

async function save() {
  const monto = parseFloat($('m').value.replace(/[$,\s]/g, '')), concepto = $('c').value.trim(), fecha = $('f').value;
  if (!fecha || !concepto || !(monto > 0)) return say('Falta fecha, concepto o un monto válido.');
  const g = { fecha, concepto, cat: $('k').value, monto };
  $('go').disabled = true; say('Guardando…');
  try {
    const row = await send(g);
    say('Guardado en la fila ' + row + '.');
  } catch (e) {
    if (e.fatal) { say('Error: ' + e.message); $('go').disabled = false; return; }
    L.q = JSON.stringify([...q(), g]);
    say('Sin conexión: guardado en el celular, se enviará solo.');
  }
  $('c').value = ''; $('m').value = '';
  $('go').disabled = false; flush();
}

function init() {
  const ok = L.u && L.k;
  $('cfg').hidden = !!ok; $('form').hidden = !ok; $('rc').hidden = !ok;
  if (ok) flush();
}
(() => {
  const t = new Date(); t.setMinutes(t.getMinutes() - t.getTimezoneOffset());
  $('f').value = t.toISOString().slice(0, 10);
  $('go').onclick = save;
  $('rc').onclick = e => { e.preventDefault(); if (confirm('¿Borrar la configuración de este dispositivo?')) { L.removeItem('u'); L.removeItem('k'); init(); } };
  $('sc').onclick = () => {
    const u = $('u').value.trim(), k = $('k0').value.trim();
    if (!u.startsWith('https://script.google.com/') || !k) return say('Revisa la dirección y la clave.');
    L.u = u; L.k = k; say(''); init();
  };
  window.addEventListener('online', flush);
  init();
})();
</script>
</body>
</html>
